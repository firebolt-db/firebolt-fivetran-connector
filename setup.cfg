[mypy]
disallow_untyped_defs = True
show_error_codes = True
files = .

[flake8]
max-line-length = 88
per-file-ignores = __init__.py:F401
ignore =
    # Whitespace before ':'. Ignored for black compatibility
    E203,
    # Line break occurred before a binary operator. Ignored for black compatibility
    W503,
    # Missing docstring in public module
    D100,
    # Missing docstring in public package
    D104,
    # Missing docstring in magic method
    D105,
    # Missing docstring in __init__
    D107,
    # Missing whitespace after ':' (false positives on URLs)
    E231,
    # Multiple spaces after ',' (formatting in multi-line strings)
    E241,
    # Whitespace before ')' (formatting in multi-line strings)
    E202
ban-relative-imports = True
docstring-convention = google
inline-quotes = "

[tool:pytest]
testpaths = tests

[isort]
profile = black
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
line_length = 88
