[mypy]
disallow_untyped_defs = True
show_error_codes = True
files = .

[flake8]
max-line-length = 88
per-file-ignores = __init__.py:F401
ignore =
    E203,
    W503,
    D100,
    D104,
    D105,
    D107,
    E231,
    E241,
    E202
ban-relative-imports = True
docstring-convention = google
inline-quotes = "

[tool:pytest]
testpaths = tests

[isort]
profile = black
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
line_length = 88
