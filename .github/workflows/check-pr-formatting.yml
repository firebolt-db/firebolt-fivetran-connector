name: Pull request formatting

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, edited]

jobs:
  pr-formatting:
    runs-on: ubuntu-latest
    steps:
      - name: Formatting conventions
        uses: jef/conventional-commits-pr-action@v1.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
